# Include ONCE inside http {}, e.g. /etc/nginx/conf.d/relay-login-limits.conf.
# Non-login requests have an empty key and are not limited.
map "$request_method:$uri" $relay_login_ip {
    default "";
    "POST:/api/login" $binary_remote_addr;
}
limit_req_zone $relay_login_ip zone=relay_login:10m rate=10r/m;
