# Include relay-login-limits.conf once in http {} before enabling this site.
# Add a NEW site after administrator review; do not replace code-server's site.
# Replace domain and TLS certificate paths. Obtain certificates separately.
server {
    listen 443 ssl;
    server_name workbench.example.com;
    ssl_certificate /etc/letsencrypt/live/workbench.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workbench.example.com/privkey.pem;

    # URL query strings can contain sensitive project paths. No application access log.
    access_log off;
    error_log /var/log/nginx/remote-workbench-error.log crit;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    location / {
        limit_req zone=relay_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        # Set Gateway trustedProxyIps to ["127.0.0.1"] for this local proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
        add_header X-Accel-Buffering no always;
    }
}

server {
    listen 80;
    server_name workbench.example.com;
    return 308 https://workbench.example.com$request_uri;
}
