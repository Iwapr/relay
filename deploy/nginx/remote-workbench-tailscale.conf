# Include relay-login-limits.conf once in http {} before enabling this site.
# Cloud Nginx: HTTPS public origin -> Gateway over Tailscale.
# Gateway must set tailscaleHost to 100.64.0.10 and
# tailscaleProxyOrigin to https://relay.example.com:14080.
# Replace the TLS certificate paths with the existing certificate files.
server {
    listen 14080 ssl;
    server_name relay.example.com;
    ssl_certificate /REPLACE_WITH_CERTIFICATE_PATH/fullchain.pem;
    ssl_certificate_key /REPLACE_WITH_CERTIFICATE_PATH/privkey.pem;

    access_log off;
    error_log /var/log/nginx/remote-workbench-error.log crit;
    client_max_body_size 1m;
    client_body_buffer_size 1m;

    location / {
        limit_req zone=relay_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://100.64.0.10:4080;
        proxy_http_version 1.1;
        # Preserve the public port; $host would drop :14080.
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        # The browser's Origin is forwarded unchanged. Do not rewrite it.
        # Overwrite spoofed client input; Gateway must trust ONLY this proxy IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
        add_header X-Accel-Buffering no always;
    }
}
